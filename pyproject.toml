[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openshao-modkit"
version = "0.1.0"
description = "Extract the textures of Mortal Kombat: Shaolin Monks from your own copy and compile edited pictures into OpenShao texture packs (.ostp)."
readme = "README.md"
classifiers = ["License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)"]
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy", "Pillow", "unicorn>=2"]

[project.optional-dependencies]
gui = ["imgui-bundle"]

[project.scripts]
modkit = "modkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modkit = ["_native/*.so", "_native/*.dll", "_native/*.dylib", "gui/fonts/*"]
